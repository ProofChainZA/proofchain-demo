name: CI/CD

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 708424746880.dkr.ecr.af-south-1.amazonaws.com
  IMAGE_NAME: proofchain-demo-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    env:
      FLOATING_TAG: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::708424746880:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG -t $ECR_REGISTRY/$IMAGE_NAME:$FLOATING_TAG .
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$IMAGE_NAME:$FLOATING_TAG

      - name: Join Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-ci-${{ github.repository_id }}-${{ github.run_id }}
          version: 1.82.5

      - name: Set up kubeconfig (rewrite server URL to Tailscale IP)
        env:
          PROD_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}
          STAGING_KUBECONFIG: ${{ secrets.STAGING_K3S_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          if [ "${{ github.ref_name }}" = "staging" ]; then
            printenv STAGING_KUBECONFIG \
              | sed 's|https://127\.0\.0\.1:6443|https://100.97.162.90:6443|' \
              > ~/.kube/config
          else
            printenv PROD_KUBECONFIG \
              | sed 's|https://57\.129\.83\.241:6443|https://100.78.121.31:6443|' \
              > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      # ── PROD deploys via GitOps ───────────────────────────────────────
      # Push the new image tag as a commit to proofchain-infra; ArgoCD's
      # automated sync rolls it out.
      - name: Deploy to prod (commit image pin to proofchain-infra)
        if: github.ref_name != 'staging'
        env:
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && { printenv INFRA_DEPLOY_KEY; echo; } > ~/.ssh/infra_key
          chmod 600 ~/.ssh/infra_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/infra_key -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 10 git@github.com:ProofChainZA/proofchain-infra.git /tmp/infra
          cd /tmp/infra/kubernetes/production/overlays/k3s-ha
          git config user.name "demo-ci"
          git config user.email "ci@proofchain.co.za"
          for i in 1 2 3; do
            kustomize edit set image $ECR_REGISTRY/$IMAGE_NAME=$ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}
            if git diff --quiet; then echo "pin already current"; break; fi
            git commit -aqm "deploy: proofchain-demo ${{ github.sha }} (CI run ${{ github.run_id }})"
            git push -q origin main && break
            echo "push rejected (concurrent pin bump) — rebasing, attempt $i"
            git fetch -q origin main && git reset -q --hard origin/main
          done

      - name: Wait for ArgoCD rollout (prod)
        if: github.ref_name != 'staging'
        run: |
          IMAGE=$ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}
          CURRENT=""
          for i in $(seq 1 60); do
            CURRENT=$(kubectl -n proofchain get deploy demo-app \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            [ "$CURRENT" = "$IMAGE" ] && break
            sleep 10
          done
          [ "$CURRENT" = "$IMAGE" ] || { echo "::error::ArgoCD did not sync the new image within 10 min"; exit 1; }
          kubectl rollout status deployment/demo-app -n proofchain --timeout=300s

      # ── STAGING keeps direct kubectl (no ArgoCD on the staging cluster) ──
      - name: Deploy to k3s (staging)
        if: github.ref_name == 'staging'
        run: |
          kubectl set image deployment/demo-app demo-app=$ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }} -n proofchain
          kubectl rollout status deployment/demo-app -n proofchain --timeout=300s
